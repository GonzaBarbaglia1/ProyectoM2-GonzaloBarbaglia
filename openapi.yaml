openapi: 3.0.0
info:
  title: Proyecto M2 - API REST
  version: 1.0.0
  description: API REST de autores y posts desarrollada con Node.js, Express y PostgreSQL
servers:
  - url: http://localhost:3000
    description: Servidor local
  - url: https://proyectom2-gonzalobarbaglia-production.up.railway.app
    description: Servidor Railway
paths:
  /posts:
    get:
      summary: Obtener todos los posts
      tags:
        - Posts
      responses:
        "200":
          description: Lista de posts obtenida correctamente
        "500":
          description: Error interno del servidor
    post:
      summary: Crear un nuevo post
      description: Crea una publicación asociada a un autor existente. El campo
        published es opcional y, si se omite, toma el valor false.
      tags:
        - Posts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - author_id
                - title
                - content
              properties:
                author_id:
                  type: integer
                  example: 1
                title:
                  type: string
                  example: Mi primer post
                content:
                  type: string
                  example: Contenido del post
                published:
                  type: boolean
                  default: false
                  description: Indica si el post está publicado. Solo acepta true o false.
                  example: false
      responses:
        "201":
          description: Post creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  author_id:
                    type: integer
                  title:
                    type: string
                  content:
                    type: string
                  published:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
        "400":
          description: Faltan datos obligatorios, published no es booleano o el autor
            indicado no existe
        "500":
          description: Error interno del servidor
  /posts/author/{authorId}:
    get:
      summary: Obtener los posts de un autor con los datos del autor
      tags:
        - Posts
      parameters:
        - in: path
          name: authorId
          required: true
          schema:
            type: integer
          description: ID del autor
      responses:
        "200":
          description: Posts del autor obtenidos correctamente
        "500":
          description: Error interno del servidor
  /posts/{id}:
    get:
      summary: Obtener un post por ID
      tags:
        - Posts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del post
      responses:
        "200":
          description: Post encontrado correctamente
        "400":
          description: El ID debe ser un número entero positivo
        "404":
          description: Post no encontrado
        "500":
          description: Error interno del servidor
    put:
      summary: Actualizar un post
      tags:
        - Posts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                author_id:
                  type: integer
                  example: 1
                title:
                  type: string
                  example: Post actualizado
                content:
                  type: string
                  example: Contenido actualizado
                published:
                  type: boolean
                  example: true
      responses:
        "200":
          description: Post actualizado correctamente
        "400":
          description: Datos inválidos
        "404":
          description: Post no encontrado
        "500":
          description: Error interno del servidor
    delete:
      summary: Eliminar un post
      tags:
        - Posts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del post
      responses:
        "204":
          description: Post eliminado correctamente
        "404":
          description: Post no encontrado
        "500":
          description: Error interno del servidor
  /authors:
    get:
      summary: Obtener todos los autores
      tags:
        - Authors
      responses:
        "200":
          description: Lista de autores obtenida correctamente
        "500":
          description: Error interno del servidor
    post:
      summary: Crear un nuevo autor
      tags:
        - Authors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
              properties:
                name:
                  type: string
                  example: Gonzalo
                apellido:
                  type: string
                  example: Barbaglia
                email:
                  type: string
                  example: autor@correo.com
                bio:
                  type: string
                  example: Desarrollador Full Stack
      responses:
        "201":
          description: Autor creado correctamente
        "409":
          description: Datos inválidos o email ya existente
        "500":
          description: Error interno del servidor
  /authors/{id}:
    get:
      summary: Obtener un autor por ID
      tags:
        - Authors
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del autor
      responses:
        "200":
          description: Autor encontrado correctamente
        "400":
          description: El ID debe ser un número entero positivo
        "404":
          description: Autor no encontrado
        "500":
          description: Error interno del servidor
    put:
      summary: Actualizar un autor
      tags:
        - Authors
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del autor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Gonzalo
                apellido:
                  type: string
                  example: Barbaglia
                email:
                  type: string
                  example: autor@correo.com
                bio:
                  type: string
                  example: Desarrollador Full Stack
      responses:
        "200":
          description: Autor actualizado correctamente
        "400":
          description: Datos inválidos
        "404":
          description: Autor no encontrado
        "500":
          description: Error interno del servidor
    delete:
      summary: Eliminar un autor
      tags:
        - Authors
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del autor
      responses:
        "204":
          description: Autor eliminado correctamente
        "404":
          description: Autor no encontrado
        "500":
          description: Error interno del servidor
components: {}
tags: []
